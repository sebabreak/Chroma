<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CHROMA · riservato</title>
<style>
  :root { --bg: #f4f1ec; --fg: #1d1b19; --muted: #6b655e; --line: #d8d2c9; --accent: #7b2482; --err: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121110; --fg: #f1ede6; --muted: #a39c92; --line: #34302c; --accent: #c77dd0; --err: #ff8a80; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 360px; }
  h1 { font-size: 28px; letter-spacing: .04em; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  label { display: block; font-size: 14px; margin-bottom: 6px; }
  input { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { width: 100%; margin-top: 12px; font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  #err { min-height: 1.5em; color: var(--err); font-size: 14px; margin: 10px 0 0; }
  a { color: var(--accent); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>CHROMA</h1>
  <p>Progetto riservato. Inserisci il codice di accesso per aprirlo.</p>
  <form id="f" hidden>
    <label for="c">Codice di accesso</label>
    <input id="c" type="password" autocomplete="current-password" required autofocus>
    <button id="b">Apri</button>
    <p id="err" role="alert"></p>
  </form>
  <a id="r" hidden>Non hai il codice? Chiedilo qui</a>
</main>
<script>
const C = {"root":"./","salt":"y/8tt/HuEJkZnb4SvG1ozw==","iter":600000,"titolo":"CHROMA","ritorno":"https://profili-cv.github.io/sebastyan-buryas/#laboratorio"};
const root = new URL(C.root, location.href), f = document.getElementById('f'), err = document.getElementById('err'), b = document.getElementById('b');
if (C.ritorno) { const r = document.getElementById('r'); r.href = C.ritorno; r.hidden = false; }
const db = () => new Promise((ok, ko) => { const r = indexedDB.open('cifra', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const leggi = async () => { const d = await db(); return new Promise(ok => { const g = d.transaction('k').objectStore('k').get('k'); g.onsuccess = () => ok(g.result || null); g.onerror = () => ok(null); }); };
const salva = async k => { const d = await db(); return new Promise((ok, ko) => { const t = d.transaction('k', 'readwrite'); t.objectStore('k').put(k, 'k'); t.oncomplete = ok; t.onerror = () => ko(t.error); }); };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function avvia() {
  // se il service worker c'è già ma la pagina è ancora questa, non ricaricare all'infinito
  const ora = Date.now(), prima = +sessionStorage.getItem('cifra-avvio') || 0;
  if (ora - prima < 8000) throw new Error('loop');
  sessionStorage.setItem('cifra-avvio', ora);
  await navigator.serviceWorker.register(new URL('sw.js', root), { scope: root.pathname, updateViaCache: 'none' });
  if (navigator.serviceWorker.controller) return location.reload();
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
}

f.onsubmit = async e => {
  e.preventDefault(); err.textContent = ''; b.disabled = true; b.textContent = 'Controllo…';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('c').value.trim()), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(C.salt), iterations: C.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const m = await (await fetch(new URL('_/m', root), { cache: 'no-cache' })).arrayBuffer();
    try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: m.slice(0, 12) }, k, m.slice(12)); }
    catch { throw new Error('codice'); }
    await salva(k);
    sessionStorage.removeItem('cifra-avvio');
    b.textContent = 'Apro…';
    await avvia();
  } catch (x) {
    err.textContent = x.message === 'codice' ? 'Codice non valido.' : 'Non riesco ad aprirlo adesso. Controlla la connessione e riprova.';
    b.disabled = false; b.textContent = 'Apri';
  }
};

(async () => {
  if (!('serviceWorker' in navigator) || !window.crypto?.subtle || !window.indexedDB) {
    err.textContent = 'Questo browser non può aprire il progetto. Prova con Chrome o Safari, fuori dalla navigazione privata.';
    f.hidden = false; b.disabled = true; return;
  }
  try { if (await leggi()) return await avvia(); } catch {}
  f.hidden = false; document.getElementById('c').focus();
})();
</script>
</body>
</html>
